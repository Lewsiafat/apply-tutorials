name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/projects/apply-tutorials
            git pull origin main
            if [ ! -f /etc/nginx/conf.d/projects/apply-tutorials.conf ]; then
              sudo tee /etc/nginx/conf.d/projects/apply-tutorials.conf > /dev/null << 'NGINX'
            location /apply-tutorials/ {
                alias /srv/projects/apply-tutorials/;
                index index.html;
                try_files $uri $uri/ =404;
            }
            NGINX
            fi
            sudo nginx -t && sudo systemctl reload nginx
